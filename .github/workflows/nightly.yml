name: nightly

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (patches + config)
        uses: actions/checkout@v4
        with:
          path: board

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev kmod

      - name: Checkout upstream Linux at pinned base
        run: |
          git config --global advice.detachedHead false
          git clone --filter=blob:none --no-checkout \
            https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git linux
          cd linux
          git checkout 666539eecdf4db623f5e3c3e55cf9f2dfad24aa4

      - name: Apply board patch series + config
        run: |
          cd linux
          git am ../board/kernel/patches/*.patch
          cp ../board/configs/a733-orangepi4pro.config .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build Image + dtbs + modules
        run: |
          cd linux
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image dtbs modules

      - name: Package
        run: |
          cd linux
          MODVER=$(make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- kernelrelease)
          mkdir -p staging
          cp arch/arm64/boot/Image staging/Image
          cp arch/arm64/boot/dts/allwinner/sun60i-a733-orangepi-4-pro.dtb \
             staging/sun60i-a733-orangepi-4-pro.dtb
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- INSTALL_MOD_PATH=mods modules_install
          tar -C mods -cf staging/modules-${MODVER}.tar lib/modules
          tar -C staging -czf opi4pro-nightly-${MODVER}.tar.gz Image \
              sun60i-a733-orangepi-4-pro.dtb modules-${MODVER}.tar
          echo "MODVER=${MODVER}" >> "$GITHUB_ENV"

      - name: Publish rolling nightly release
        run: |
          cd board
          git push origin :refs/tags/nightly 2>/dev/null || true
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly --target "$GITHUB_SHA" \
            --title "opi4pro nightly ${MODVER}" \
            --notes "Automated nightly build. kernelrelease=${MODVER}" \
            ../linux/opi4pro-nightly-${MODVER}.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
